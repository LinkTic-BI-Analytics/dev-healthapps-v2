# SOLO DESARROLLO LOCAL.
# En producción se usa la imagen del target `prod` del Dockerfile conectada a una instancia de
# PostgreSQL aparte (Supabase), con las mismas variables DB_* inyectadas en tiempo de ejecución.
#
# Uso: cp .env.example .env  →  docker compose up
#
# La conexión a la base es SIEMPRE la del contenedor `db`: las DB_* y DATABASE_URL del .env se
# sobrescriben aquí, así que el mismo .env puede apuntar a Supabase para `pnpm dev` sin que
# `docker compose up` lo toque. Del .env solo se usan JWT_*, SEED_*, CHECK_*, etc.

name: health-apps

# Conexión al PostgreSQL local, compartida por app y worker.
x-local-db: &local-db
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: health_apps
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_SCHEMA: app_health
  DB_SSLMODE: disable
  DATABASE_URL: ""

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_apps
      DB_SCHEMA: app_health
    ports:
      # LOCAL_DB_PORT permite cambiar el puerto del equipo si 5432 ya está ocupado.
      - "${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 guarda los datos en /var/lib/postgresql/18/docker: se monta el directorio padre.
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      # Dentro de la red de Compose la base se alcanza por el nombre del servicio.
      <<: *local-db
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # node_modules y .next del contenedor (Linux), no los del equipo anfitrión.
      - /app/node_modules
      - /app/.next
      # Caché de pnpm compartido: las reinstalaciones no vuelven a descargar todo.
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      db:
        condition: service_healthy

  # Worker de verificaciones periódicas (ADR-004); se reinicia al cambiar el código.
  worker:
    build:
      context: .
      target: dev
    # --ignore-scripts: el cliente de Prisma lo genera `app` en la carpeta compartida (src/generated);
    # generarlo aquí también provocaría una carrera entre los dos contenedores.
    command: ["sh", "-c", "pnpm install --frozen-lockfile --ignore-scripts && pnpm worker:dev"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *local-db
      # Dentro del contenedor, `localhost` es el propio contenedor: las URLs con localhost/127.0.0.1
      # se verifican contra el equipo anfitrión (servicios que corres en tu máquina).
      CHECK_LOCALHOST_ALIAS: host.docker.internal
    extra_hosts:
      # Necesario en Linux; Docker Desktop (macOS/Windows) ya lo resuelve.
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  db-data:
  pnpm-store:
